# Render.com Blueprint — free tier deployment for the game server
# Deploy via: Render Dashboard → New + → Blueprint → select this repository
#
# Notes:
# - Free plan sleeps after ~15 min idle; first request takes ~50 s to wake.
# - No DATABASE_URL set → server runs in in-memory mode (balances reset on restart).
# - JWT_SECRET is auto-generated by Render.

services:
  - type: web
    name: widow-spider-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: https://uniqcloth.github.io
      - key: JWT_SECRET
        generateValue: true
